# NPM publish via GitHub Actions using Trusted Publishing (OIDC).
# Configured in npmjs.com -> package settings -> Trusted Publisher with
# Organization=Aitonos, Repository=signalk-pypilot-newui,
# Workflow=publish.yml. No NPM_TOKEN secret needed: GitHub signs an OIDC
# token that npm verifies against the trusted publisher config, and npm
# adds a "verified provenance" badge on the package page.
#
# Trigger: any tag matching v* (typical semver: v2.0.1, v2.1.0, v3.0.0).
# Also supports manual trigger from the Actions tab for reruns.

name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run (for the audit trail)"
        required: false
        default: "manual rerun"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # id-token: write is REQUIRED for OIDC / Trusted Publishing.
      # contents: read lets the checkout step read the repo.
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # setup-node@v4 with Node 22 still ships npm 10.x, which pre-dates
      # full support for Trusted Publishing (OIDC) as a publish credential
      # (the provenance signing works but the final PUT fails with 404).
      # Force the latest npm so `npm publish` and Trusted Publisher agree
      # on the OIDC handshake. Reference:
      # https://docs.npmjs.com/trusted-publishers
      - name: Upgrade npm to latest (Trusted Publishing needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - name: Sanity check - package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          echo "Tag version:     $TAG"
          echo "package.json:    $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install (npm ci)
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Publish to npm (Trusted Publisher + provenance)
        run: npm publish --access public --provenance
